services:
  postgres:
    image: postgres:16-alpine
    container_name: bookyourpto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bookyourpto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookyourpto-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Required ONLY at build time for Prisma client generation
        DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/bookyourpto
    container_name: bookyourpto-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - .env
    environment:
      # Runtime override for Docker networking
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/bookyourpto
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookyourpto-network

volumes:
  postgres_data:

networks:
  bookyourpto-network:
    driver: bridge
