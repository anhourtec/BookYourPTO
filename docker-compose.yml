version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookyourpto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bookyourpto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookyourpto-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookyourpto-app
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookyourpto-network

volumes:
  postgres_data:
    driver: local

networks:
  bookyourpto-network:
    driver: bridge