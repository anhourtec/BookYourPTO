version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookyourpto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: bookyourpto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bookyourpto-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookyourpto-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bookyourpto-network

volumes:
  postgres_data:
    driver: local

networks:
  bookyourpto-network:
    driver: bridge