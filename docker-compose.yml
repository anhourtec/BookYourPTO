  #     - JWT_SECRET=${JWT_SECRET}
  #     - NODE_ENV=production
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - bookyourpto-network


  # We'll add Redis later
  # redis:
  #   image: redis:7-alpine

volumes:
  postgres_data:
    driver: local

networks:
  bookyourpto-network:
    driver: bridge